name: CI

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - 'Makefile'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  go:
    name: Go
    uses: bnema/gh-actions/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.25'
      lint-command: make lint
      test-command: make test
